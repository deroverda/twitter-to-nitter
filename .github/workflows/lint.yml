name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run web-ext lint
        run: |
          echo "## Lint results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          set +e
          npx web-ext@10.6.0 lint > lint-output.txt 2>&1
          EXIT_CODE=$?
          set -e

          cat lint-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if grep -q "errors  *[1-9]" lint-output.txt; then
            echo "❌ Lint found errors" >> "$GITHUB_STEP_SUMMARY"
          elif grep -q "warnings  *[1-9]" lint-output.txt; then
            echo "⚠️ Lint passed with warnings" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ No issues found" >> "$GITHUB_STEP_SUMMARY"
          fi

          cat lint-output.txt
          exit $EXIT_CODE
