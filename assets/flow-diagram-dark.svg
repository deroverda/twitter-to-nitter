<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9198a1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="520" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- A: start -->
  <rect x="210" y="20" width="280" height="70" rx="8" fill="#37474f"/>
  <text x="350" y="60" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">x.com/elonmusk</text>

  <line x1="350" y1="90" x2="350" y2="118" stroke="#9198a1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- B: try instance -->
  <rect x="210" y="120" width="280" height="70" rx="8" fill="#2f6fc9"/>
  <text x="350" y="160" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Try a Nitter instance</text>

  <line x1="350" y1="190" x2="350" y2="213" stroke="#9198a1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- C: decision diamond -->
  <polygon points="350,215 520,290 350,365 180,290" fill="#d4a017"/>
  <text x="350" y="278" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="bold">Rate limited, blocked, unreachable,</text>
  <text x="350" y="298" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="bold">or an error page?</text>

  <!-- No -> Done (left) -->
  <line x1="180" y1="290" x2="150" y2="393" stroke="#9198a1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="135" y="345" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="bold">No</text>

  <!-- Yes -> Try next (right) -->
  <line x1="520" y1="290" x2="550" y2="393" stroke="#9198a1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="345" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="bold">Yes</text>

  <!-- Done box (green) -->
  <rect x="20" y="395" width="260" height="70" rx="8" fill="#3fb46f"/>
  <text x="150" y="435" text-anchor="middle" fill="#0d1117" font-size="16" font-weight="bold">Done - stay here</text>

  <!-- Try next box (red) -->
  <rect x="420" y="395" width="260" height="70" rx="8" fill="#d9534f"/>
  <text x="550" y="429" text-anchor="middle" fill="#0d1117" font-size="15" font-weight="bold">Try the next instance</text>
  <text x="550" y="447" text-anchor="middle" fill="#0d1117" font-size="12">(repeats until one works)</text>
</svg>
