<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" role="img" aria-label="Flowchart: you click an X link; the extension opens it on a Nitter instance instead. If the page works you read it on Nitter. On a bot check it stays until the check is solved, then checks the page again. If the page does not work and another instance can be tried within 45 seconds, it opens the next one; otherwise it shows an error page, never X." font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9198a1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="650" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- A: start -->
  <rect x="270" y="20" width="260" height="50" rx="8" fill="#37474f" stroke="#57606a" stroke-width="1"/>
  <text x="400" y="51" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">You click an X link</text>

  <!-- A to B -->
  <line x1="400" y1="70" x2="400" y2="98" stroke="#9198a1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- B: open on Nitter -->
  <rect x="220" y="100" width="360" height="70" rx="8" fill="#2f6fc9"/>
  <text x="400" y="131" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">The extension opens it on</text>
  <text x="400" y="151" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">a Nitter instance instead</text>

  <!-- B to C -->
  <line x1="400" y1="170" x2="400" y2="198" stroke="#9198a1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- C: does the page work -->
  <polygon points="400,200 530,260 400,320 270,260" fill="#d4a017"/>
  <text x="400" y="266" text-anchor="middle" fill="#0d1117" font-size="16" font-weight="bold">Does the page work?</text>

  <!-- C to E: bot check -->
  <polyline points="270,260 140,260 140,358" fill="none" stroke="#9198a1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="205" y="250" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">Bot check</text>

  <!-- E: bot check -->
  <rect x="30" y="360" width="220" height="70" rx="8" fill="#4fa3ab"/>
  <text x="140" y="391" text-anchor="middle" fill="#0d1117" font-size="16" font-weight="bold">Stays on the bot check</text>
  <text x="140" y="411" text-anchor="middle" fill="#0d1117" font-size="16" font-weight="bold">until it is solved</text>

  <!-- E to C: solved -->
  <polyline points="250,395 335,395 335,293" fill="none" stroke="#9198a1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="327" y="345" text-anchor="end" fill="#e6edf3" font-size="16" font-weight="bold">Solved</text>

  <!-- C to D: yes -->
  <line x1="400" y1="320" x2="400" y2="468" stroke="#9198a1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="430" text-anchor="start" fill="#e6edf3" font-size="16" font-weight="bold">Yes</text>

  <!-- D: read on Nitter -->
  <rect x="290" y="470" width="220" height="50" rx="8" fill="#3fb46f"/>
  <text x="400" y="501" text-anchor="middle" fill="#0d1117" font-size="16" font-weight="bold">You read it on Nitter</text>

  <!-- C to F: no -->
  <polyline points="530,260 640,260 640,328" fill="none" stroke="#9198a1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="585" y="250" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">No</text>

  <!-- F: another instance -->
  <polygon points="640,330 770,400 640,470 510,400" fill="#d4a017"/>
  <text x="640" y="396" text-anchor="middle" fill="#0d1117" font-size="16" font-weight="bold">Another instance to try</text>
  <text x="640" y="416" text-anchor="middle" fill="#0d1117" font-size="16" font-weight="bold">within 45 seconds?</text>

  <!-- F to B: yes -->
  <polyline points="770,400 785,400 785,135 582,135" fill="none" stroke="#9198a1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="777" y="270" text-anchor="end" fill="#e6edf3" font-size="16" font-weight="bold">Yes</text>

  <!-- F to G: no -->
  <line x1="640" y1="470" x2="640" y2="568" stroke="#9198a1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="652" y="525" text-anchor="start" fill="#e6edf3" font-size="16" font-weight="bold">No</text>

  <!-- G: error page -->
  <rect x="530" y="570" width="220" height="50" rx="8" fill="#d9534f"/>
  <text x="640" y="601" text-anchor="middle" fill="#0d1117" font-size="16" font-weight="bold">Error page, never X</text>
</svg>
