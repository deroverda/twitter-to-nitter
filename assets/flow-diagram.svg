<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="660" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- A: start -->
  <rect x="210" y="20" width="280" height="70" rx="8" fill="#37474f"/>
  <text x="350" y="60" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">x.com/jack</text>

  <line x1="350" y1="90" x2="350" y2="118" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- B: try instance -->
  <rect x="210" y="120" width="280" height="70" rx="8" fill="#1a4d8f"/>
  <text x="350" y="152" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Try a Nitter instance</text>
  <text x="350" y="170" text-anchor="middle" fill="#ffffff" font-size="11">(preferred instance first try only)</text>

  <line x1="350" y1="190" x2="350" y2="213" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- C: decision diamond -->
  <polygon points="350,215 520,290 350,365 180,290" fill="#b8860b"/>
  <text x="350" y="278" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="bold">Is the page rate limited, blocked,</text>
  <text x="350" y="298" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="bold">unreachable, or not a real Nitter page?</text>

  <!-- No -> Done (left) -->
  <line x1="180" y1="290" x2="150" y2="393" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="135" y="345" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="bold">No</text>

  <!-- Yes -> next decision (right) -->
  <line x1="520" y1="290" x2="550" y2="395" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="345" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="bold">Yes</text>

  <!-- Done box (green) -->
  <rect x="20" y="395" width="260" height="70" rx="8" fill="#2e7d4f"/>
  <text x="150" y="427" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Success</text>
  <text x="150" y="445" text-anchor="middle" fill="#ffffff" font-size="11">stay on this Nitter page</text>

  <!-- D: second decision diamond -->
  <polygon points="550,395 665,455 550,515 435,455" fill="#b8860b"/>
  <text x="550" y="450" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="bold">Another instance left,</text>
  <text x="550" y="468" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="bold">and total time under ~45s?</text>

  <!-- D Yes -> loop back to B -->
  <polyline points="665,455 685,455 685,155 492,155" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="691" y="300" fill="#1a1a1a" font-size="13" font-weight="bold">Yes</text>

  <!-- D No -> terminal page -->
  <line x1="550" y1="515" x2="550" y2="558" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580" y="540" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="bold">No</text>

  <!-- Terminal failure page box (red) -->
  <rect x="420" y="560" width="260" height="70" rx="8" fill="#a83232"/>
  <text x="550" y="594" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">Terminal failure page</text>
  <text x="550" y="612" text-anchor="middle" fill="#ffffff" font-size="11">(retries exhausted or timed out; retry link shown)</text>
</svg>
